version: 2

models:
  - name: dim_vehicles
    columns:
      - name: vehicle_sk
        tests: [unique, not_null]

  - name: fact_battery_readings
    description: Grain -- one row per vehicle per telemetry snapshot.
    columns:
      - name: vehicle_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vehicles')
                field: vehicle_sk

  - name: fact_charging_sessions
    description: Grain -- one row per charging session.
    columns:
      - name: charge_id
        tests: [unique, not_null]
      - name: vehicle_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vehicles')
                field: vehicle_sk
